[package]
name = "thymeleaf-sa-token"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Sa-Token security dialect for the framework-neutral thymeleaf template engine"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
thymeleaf = { path = "../../thymeleaf" }
sa-token-core = { version = "0.1.18", path = "../../../sa-token-rust/sa-token-core" }

[dev-dependencies]
futures-executor = "0.3.31"
tokio = { version = "1", features = ["rt", "macros"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
