[package]
name = "thymeleaf-gotham"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Gotham integration for the framework-neutral thymeleaf template engine"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
gotham = { version = "=0.8.0", default-features = false }
http = "1.3"
http-body-util = "0.1.3"
thymeleaf = { path = "../../thymeleaf" }

[dev-dependencies]
futures-executor = "0.3.31"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
