[package]
name = "thymeleaf-actix-web"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Actix Web integration for the framework-neutral thymeleaf template engine"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
actix-web = { version = "=4.11.0", default-features = false, features = ["macros"] }
http-body = "1.0"
thymeleaf = { path = "../.." }

[dev-dependencies]
http = "1.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
