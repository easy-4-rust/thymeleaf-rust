[package]
name = "thymeleaf-salvo"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Salvo integration for the framework-neutral thymeleaf template engine"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
futures-util = "0.3.31"
salvo = { version = "=0.85.0", default-features = false }
thymeleaf = { path = "../.." }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
