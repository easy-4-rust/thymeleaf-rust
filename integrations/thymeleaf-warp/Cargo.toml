[package]
name = "thymeleaf-warp"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Warp integration for the framework-neutral thymeleaf template engine"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
bytes = "1.10"
http = "1.3"
thiserror = "2.0"
thymeleaf = { path = "../.." }
warp = { version = "=0.4.3", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
