[package]
name = "thymeleaf-test"
description = "thymeleaf-rust 整体差分验收模块——Java thymeleaf-tests 黄金语料（2608 用例逐字节对照）+ 109 个对象级 parity 测试 + 全项目 source-test parity 门禁（对应 Java thymeleaf-tests-core + lib/testing 的角色）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# 转发 thymeleaf 的可选 DTD 验证 feature（供 cfg 门控的 EngineConfiguration::new 参数）。
dtd-validation = ["thymeleaf/dtd-validation"]

[dependencies]
thymeleaf = { path = "../thymeleaf" }

[dev-dependencies]
bytes = "1.10"
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures-executor = "0.3.31"
futures-util = { version = "0.3.31", features = ["sink"] }
html-escape = "0.2.14"
html5gum = { version = "0.8.4", default-features = false }
http = "1.3"
http-body = "1.0"
indexmap = "2.12"
num-bigint = "0.5.1"
proptest = { version = "1.6", features = ["timeout"] }
regex = "1.12"
serde_json = "1.0"
serial_test = "4.0"
sha2 = "0.9.9"
url = "2.5.8"
