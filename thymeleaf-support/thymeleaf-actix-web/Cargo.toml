[package]
name = "thymeleaf-actix-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Actix Web integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
actix-web = { version = "=4.11.0", default-features = false, features = ["macros", "cookies"] }
http-body = "1.0"
indexmap = "2.12"
thymeleaf = { path = "../../thymeleaf" }
url = "2.5.8"

[dev-dependencies]
http = "1.3"
tempfile = "3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
