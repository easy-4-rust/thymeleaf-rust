[package]
name = "thymeleaf-poem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Poem integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
futures-util = "0.3.31"
http-body-util = "0.1.3"
poem = { version = "=3.1.12", default-features = false }
thymeleaf = { path = "../../thymeleaf" }

[dev-dependencies]
futures-executor = "0.3.31"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
