[package]
name = "thymeleaf-topcoat"
version.workspace = true
edition.workspace = true
# topcoat 0.7.0 起全线要求 rustc 1.98（0.6.2 及以前为 1.95），故本 crate
# 实际 MSRV 已被依赖抬升；显式覆盖 workspace 的 1.95，避免 manifest 谎报。
rust-version = "1.98"
description = "Topcoat integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
http = "1.4"
indexmap = "2.12"
thymeleaf = { path = "../../thymeleaf" }
tokio = { version = "1", features = ["rt"] }
url = "2.5.8"
topcoat = { version = "=0.8.0", default-features = false, features = ["router"] }

[dev-dependencies]
futures-executor = "0.3.31"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
http = "1.4.0"
http-body-util = "0.1.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
