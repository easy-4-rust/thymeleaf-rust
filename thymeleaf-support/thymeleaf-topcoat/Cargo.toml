[package]
name = "thymeleaf-topcoat"
version.workspace = true
edition.workspace = true
# topcoat 0.12.1 要求 rustc 1.99；显式覆盖 workspace 的 1.95，
# 保持本适配器的最低版本声明与实际依赖一致。
rust-version = "1.99"
description = "Topcoat integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
http = "1.4"
indexmap = "2.12"
thymeleaf = { path = "../../thymeleaf" }
tokio = { version = "1", features = ["rt"] }
url = "2.5.8"
topcoat = { version = "=0.12.1", default-features = false, features = ["router"] }

[dev-dependencies]
futures-executor = "0.3.34"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
http = "1.4.0"
http-body-util = "0.1.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
