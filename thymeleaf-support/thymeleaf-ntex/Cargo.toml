[package]
name = "thymeleaf-ntex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ntex integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
http-body = "1.0"
ntex = { version = "=3.12.3", default-features = false, features = ["tokio"] }
thymeleaf = { path = "../../thymeleaf" }

[dev-dependencies]
futures-executor = "0.3.31"
http = "1.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
