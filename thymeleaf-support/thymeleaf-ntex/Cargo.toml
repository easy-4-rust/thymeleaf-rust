[package]
name = "thymeleaf-ntex"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Ntex integration for the framework-neutral thymeleaf template engine"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
http-body = "1.0"
ntex = { version = "=2.18.0", default-features = false, features = ["tokio"] }
thymeleaf = { path = "../../thymeleaf" }

[dev-dependencies]
futures-executor = "0.3.31"
http = "1.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
