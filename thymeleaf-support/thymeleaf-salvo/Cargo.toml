[package]
name = "thymeleaf-salvo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Salvo integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
futures-util = "0.3.31"
salvo = { version = "=0.96.0", default-features = false }
thymeleaf = { path = "../../thymeleaf" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
