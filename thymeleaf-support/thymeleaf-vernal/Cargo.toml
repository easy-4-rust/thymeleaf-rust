[package]
name = "thymeleaf-vernal"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
description = "Vernal integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
form_urlencoded = "1.2"
futures-executor = "0.3.31"
futures-util = "0.3.31"
bytes = "1.10"
http = "1.3"
indexmap = "2.12"
thymeleaf = { path = "../../thymeleaf" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
vernal-http = { git = "https://github.com/easy-4-rust/vernal.git", rev = "6d137da66529fc10c8c8af9fee175d2936a78e33" }
vernal-web = { git = "https://github.com/easy-4-rust/vernal.git", rev = "6d137da66529fc10c8c8af9fee175d2936a78e33" }

[dev-dependencies]
futures-executor = "0.3.31"
http-body = "1.0"
thymeleaf-sa-token = { path = "../thymeleaf-sa-token" }
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tokio-util = "0.7"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
