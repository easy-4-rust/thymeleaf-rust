[package]
name = "thymeleaf-warp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Warp integration for the framework-neutral thymeleaf template engine (experimental: Warp 被 axum 取代中（vernal 优先级 4 之后的生态趋势）)"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
bytes = "1.10"
http = "1.3"
thiserror = "2.0"
thymeleaf = { path = "../../thymeleaf" }
warp = { version = "=0.4.3", default-features = false }

[dev-dependencies]
futures-util = "0.3.31"
http-body = "1.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"

[features]
full = []

[[test]]
name = "adapter_contract"
required-features = ["full"]
