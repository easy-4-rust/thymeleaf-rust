[package]
name = "thymeleaf-tower"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tower integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
http = "1.4.0"
thymeleaf = { path = "../../thymeleaf" }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
futures-executor = "0.3.31"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
