[package]
name = "thymeleaf-tide"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.95"
description = "Tide integration for the framework-neutral thymeleaf template engine (experimental: Tide 0.17.0-beta 维护停滞)"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
async-std = { version = "1.13.2", default-features = false }
futures-util = { version = "0.3.34", features = ["io"] }
http-body-util = "0.1.3"
sync_wrapper = "1.0.2"
thymeleaf = { path = "../../thymeleaf" }
tide = { version = "=0.17.0-beta.1", default-features = false }

[dev-dependencies]
http = "1.3"
http-body = "1.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"

[features]
full = []

[[test]]
name = "adapter_contract"
required-features = ["full"]
