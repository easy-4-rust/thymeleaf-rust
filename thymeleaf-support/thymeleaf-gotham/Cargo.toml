[package]
name = "thymeleaf-gotham"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Gotham integration for the framework-neutral thymeleaf template engine (experimental: Gotham 上游 2022 年后停滞维护)"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
gotham = { version = "=0.8.0", default-features = false }
http = "1.3"
http-body-util = "0.1.3"
thymeleaf = { path = "../../thymeleaf" }

[dev-dependencies]
futures-executor = "0.3.31"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"

[features]
full = []

[[test]]
name = "adapter_contract"
required-features = ["full"]
