[package]
name = "thymeleaf-tonic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tonic integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
thymeleaf = { path = "../../thymeleaf" }
tonic = { version = "=0.12.3", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
