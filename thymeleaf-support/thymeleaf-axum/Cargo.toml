[package]
name = "thymeleaf-axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Axum integration for the framework-neutral thymeleaf template engine"
license.workspace = true
repository = "https://github.com/easy-4-rust/thymeleaf-rust"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
indexmap = "2.12"
thymeleaf = { path = "../../thymeleaf" }
url = "2.5.8"

[dev-dependencies]
futures-executor = "0.3.31"
http-body-util = "0.1.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
