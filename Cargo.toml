[workspace]
members = ["thymeleaf", "thymeleaf-test", "thymeleaf-examples", "thymeleaf-support/*"]
exclude = ["xtask"]
default-members = ["thymeleaf"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"
homepage = "https://github.com/easy-4-rust/thymeleaf-rust"
