[workspace]
members = [".", "thymeleaf-test", "integrations/*"]
exclude = ["xtask"]
resolver = "3"

[package]
name = "thymeleaf"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "A framework-neutral Thymeleaf-compatible dynamic template engine for Rust"
license = "MIT"
repository = "https://github.com/easy-4-rust/thymeleaf-rust"
readme = "README.md"
keywords = ["template", "thymeleaf", "html", "ssr"]
categories = ["template-engine", "web-programming"]

[dependencies]
bytes = "1.10"
chrono = "0.4.45"
chrono-tz = "0.10.4"
encoding_rs = "0.8.35"
futures-channel = { version = "0.3.31", features = ["sink"] }
futures-core = "0.3.31"
futures-executor = "0.3.31"
futures-util = { version = "0.3.31", features = ["sink"] }
html-escape = "0.2.14"
html5gum = { version = "0.8.4", default-features = false }
http = "1.3"
http-body = "1.0"
indexmap = "2.12"
java-properties = "2.0.0"
mime = "0.3.17"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
quick-xml = "0.41.0"
regex = "1.12"
ryu = "1.0.20"
thiserror = "2.0"
tracing = "0.1"
unicode-general-category = "=0.6.0"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.9.9"
tracing-subscriber = "0.3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
