name: Release Preflight

on:
  pull_request:
    paths:
      - Cargo.toml
      - thymeleaf/Cargo.toml
      - CHANGELOG.md
      - scripts/publish-precheck.sh
      - scripts/check_block_on.sh
      - .github/workflows/release-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crate-package:
    name: thymeleaf crate package / publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Inspect package file list
        run: cargo package -p thymeleaf --list --allow-dirty

      - name: Verify publish metadata, dependency graph and dry-run
        # Never upload or consume CARGO_REGISTRY_TOKEN on a pull_request.
        run: bash scripts/publish-precheck.sh

      - name: Verify core crate documentation
        run: cargo doc -p thymeleaf --all-features --no-deps

      - name: Verify no blocked release items
        run: bash scripts/check_block_on.sh
