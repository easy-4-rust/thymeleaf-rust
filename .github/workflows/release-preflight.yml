name: Release Preflight

on:
  pull_request:
    paths:
      - Cargo.toml
      - thymeleaf/Cargo.toml
      - 'thymeleaf/src/dtd/**'
      - thymeleaf/tests/dtd_file_integrity.rs
      - 'dtd-files/**'
      - CHANGELOG.md
      - scripts/publish-precheck.sh
      - scripts/build-release-bundle.sh
      - scripts/render_release_notes.py
      - .github/workflows/release.yml
      - scripts/check_block_on.sh
      - .github/workflows/release-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crate-package:
    name: thymeleaf crate package / publish dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Inspect package file list
        run: cargo package -p thymeleaf --list --allow-dirty

      - name: Verify no blocked release items
        run: bash scripts/check_block_on.sh

      - name: Verify package and assemble the release bundle
        # Never upload or consume CARGO_REGISTRY_TOKEN on a pull_request.
        run: bash scripts/publish-precheck.sh "$RUNNER_TEMP/release-precheck"
