name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout fixed Thymeleaf baseline
        uses: actions/checkout@v5
        with:
          repository: thymeleaf/thymeleaf
          ref: 10f9dd2eb8cbd98515ce14b149d115e0287d0add
          path: upstream-thymeleaf

      - name: Install fixed Java Oracle runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check migration tooling
        run: >-
          cargo clippy
          --manifest-path xtask/Cargo.toml
          --all-targets
          --
          -D warnings

      - name: Check migration tooling formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml --all --check

      - name: Test migration tooling
        run: cargo test --manifest-path xtask/Cargo.toml

      - name: Enforce migration manifest and layout
        run: >-
          cargo xtask migration-check
          --upstream upstream-thymeleaf
          --baseline 10f9dd2eb8cbd98515ce14b149d115e0287d0add
          --json target/migration-check.json

      - name: Validate fixed Java semantic baseline
        working-directory: upstream-thymeleaf
        run: >-
          mvn
          -pl
          tests/thymeleaf-tests-core,tests/thymeleaf-tests-spring5,tests/thymeleaf-tests-spring6,tests/thymeleaf-tests-springsecurity5,tests/thymeleaf-tests-springsecurity6
          -am
          test
          -DskipITs
          '-DargLine=-Duser.language=en -Duser.country=US'

      - name: Enforce Java source and runtime case parity ledger
        env:
          THYMELEAF_UPSTREAM: ${{ github.workspace }}/upstream-thymeleaf
        run: |
          python3 scripts/generate_source_parity_inventory.py \
            --surefire-root upstream-thymeleaf/tests/thymeleaf-tests-core/target/surefire-reports \
            --surefire-root upstream-thymeleaf/tests/thymeleaf-tests-spring5/target/surefire-reports \
            --surefire-root upstream-thymeleaf/tests/thymeleaf-tests-spring6/target/surefire-reports \
            --surefire-root upstream-thymeleaf/tests/thymeleaf-tests-springsecurity5/target/surefire-reports \
            --surefire-root upstream-thymeleaf/tests/thymeleaf-tests-springsecurity6/target/surefire-reports \
            --output target/source_parity_inventory.json
          cmp \
            docs/migration/baseline/source_parity_inventory.json \
            target/source_parity_inventory.json
          cargo test --test source_parity_inventory

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Enforce complete Rust semantic parity corpus
        env:
          THYMELEAF_UPSTREAM: ${{ github.workspace }}/upstream-thymeleaf
          THYMELEAF_SCOPE: semantic_all
        run: cargo test --test thtest_upstream_plain_batch

      - name: Report source coverage
        run: >-
          cargo llvm-cov
          --workspace
          --all-features
          --summary-only
