name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout fixed Thymeleaf baseline
        uses: actions/checkout@v5
        with:
          repository: thymeleaf/thymeleaf
          ref: 10f9dd2eb8cbd98515ce14b149d115e0287d0add
          path: upstream-thymeleaf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check migration tooling
        run: >-
          cargo clippy
          --manifest-path xtask/Cargo.toml
          --all-targets
          --
          -D warnings

      - name: Check migration tooling formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml --all --check

      - name: Test migration tooling
        run: cargo test --manifest-path xtask/Cargo.toml

      - name: Enforce migration manifest and layout
        run: >-
          cargo xtask migration-check
          --upstream upstream-thymeleaf
          --baseline 10f9dd2eb8cbd98515ce14b149d115e0287d0add
          --json target/migration-check.json

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Enforce 100% source coverage
        run: >-
          cargo llvm-cov
          --workspace
          --all-features
          --fail-under-lines 100
          --fail-under-functions 100
          --fail-under-regions 100
          --summary-only
