name: Release

# 正式版发布工作流：推送已审核的 v* tag（或手动选择已有 tag）触发。
# 1. validate-tag：检出目标 tag，校验 tag 格式及 Cargo workspace 版本。
# 2. publish：Ubuntu/macOS build + test + cargo publish --dry-run。
# 3. publish-crates 实际上传 crates.io；成功后 create-release 从已发布 crate 生成双语说明和构建物，再上传到 GitHub 草稿。
#
# 发布纪律：先全量验证再实际上传；CARGO_REGISTRY_TOKEN 使用组织 Actions Secret；
# GitHub Release 以 draft=true 创建，CHANGELOG 必须包含对应版本条目。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0 or v0.1.0-beta.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout target release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Extract and validate version
        id: extract
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # 支持 stable (vX.Y.Z) 与 pre-release (vX.Y.Z-{alpha,beta,rc}.N) 两种 tag
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected vX.Y.Z or vX.Y.Z-alpha.N)"
            exit 1
          fi
          CARGO_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG differs from Cargo workspace version v$CARGO_VERSION"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated version: $TAG"

  publish:
    name: Release (${{ matrix.os }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.version }}

      - name: Generate source-test parity manifest
        run: python3 scripts/generate_test_asset_manifest.py --output thymeleaf-test/source-test-parity.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --release

      - name: Run tests (release profile, same targets as CI)
        run: cargo test --workspace --release --locked

      - name: Validate crate manifest (dry-run)
        run: cargo publish --dry-run --allow-dirty -p thymeleaf

      - name: Build documentation
        run: cargo doc --no-deps --workspace

  create-release:
    name: Create GitHub Release
    needs: [validate-tag, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.version }}
          persist-credentials: false

      - name: Check for an existing public release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          states=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if grep -qx false <<< "$states"; then
            echo "Release $RELEASE_TAG is already public."
            echo "public=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.existing.outputs.public != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build assets from the published crate
        id: bundle
        if: steps.existing.outputs.public != 'true'
        run: |
          version="${RELEASE_TAG#v}"
          archive="$RUNNER_TEMP/thymeleaf-$version.crate"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --max-time 60 \
            "https://static.crates.io/crates/thymeleaf/thymeleaf-$version.crate" -o "$archive"
          tar -xOzf "$archive" "thymeleaf-$version/.cargo_vcs_info.json" |
            python3 -c 'import json, sys; actual=json.load(sys.stdin)["git"]["sha1"]; sys.exit(0 if actual == sys.argv[1] else f"Published crate commit {actual} differs from release commit {sys.argv[1]}")' "$(git rev-parse HEAD)"
          bundle="$RUNNER_TEMP/release-bundle"
          bash scripts/build-release-bundle.sh "$archive" "$bundle"
          echo "directory=$bundle" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release draft
        if: steps.existing.outputs.public != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.version }}
          name: ${{ needs.validate-tag.outputs.version }}
          body_path: ${{ steps.bundle.outputs.directory }}/release-notes.md
          files: |
            ${{ steps.bundle.outputs.directory }}/thymeleaf-*.crate
            ${{ steps.bundle.outputs.directory }}/thymeleaf-*-api-docs.tar.gz
            ${{ steps.bundle.outputs.directory }}/SHA256SUMS
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(needs.validate-tag.outputs.version, '-') }}

  precheck:
    name: Publish Precheck
    needs: [validate-tag, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 参考 wxrust scripts/publish-order.sh：本仓只发 1 个 crate（thymeleaf-test
      # publish=false），预检脚本验证元数据/无内部 path 依赖/dry-run/CHANGELOG
      - name: Enforce unpublished task gate before publishing
        run: bash scripts/check_block_on.sh

      - name: Validate package and assemble the release bundle
        run: bash scripts/publish-precheck.sh "$RUNNER_TEMP/release-precheck"

  dry-run-publish:
    name: Dry-run Publish (validation)
    needs: [validate-tag, precheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo publish --dry-run for single crate
        env:
          THYMELEAF_UPSTREAM: ${{ github.workspace }}/upstream-thymeleaf
        run: cargo publish -p thymeleaf --dry-run --allow-dirty

  publish-crates:
    name: Publish to crates.io
    needs: [validate-tag, dry-run-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 参考 wxrust publish-013.sh：3 次重试（含 429 限流退避 + 版本已存在
      # 幂等成功）。脚本内置 token 前置检查与失败终止。
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish.sh
