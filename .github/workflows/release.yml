name: Release

# Beta/稳定版发版工作流：tag v* 触发 → 4 步流水线（参考 easydoc-rust .github/workflows/release.yml）。
# 1. validate-tag：解析与校验 tag 格式（vX.Y.Z 或 vX.Y.Z-alpha.N）
# 2. publish：在三平台（ubuntu/macos/windows）build + test + cargo publish --dry-run
# 3. create-release + publish-crates：并行创建 GitHub Release 草稿与（可选）crates.io 发布
#
# 0.1.0 阶段启用 publish-crates（需 CARGO_REGISTRY_TOKEN secret）；当前 beta 阶段仅演练。
#
# 验收纪律 v3（与 docs/release/security.md 一致）：
# 验收纪律 v3（与 docs/release/security.md 一致）：
# - 仅 cargo publish --dry-run（不实际上传 crates.io）
# - GitHub Release 草稿（draft=true，待维护者审核）
# - CHANGELOG 必须含对应版本条目（缺失 → 整体失败）

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.0 or v0.1.0-beta.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Extract and validate version
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          # 支持 stable (vX.Y.Z) 与 pre-release (vX.Y.Z-{alpha,beta,rc}.N) 两种 tag
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG (expected vX.Y.Z or vX.Y.Z-alpha.N)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated version: $TAG"

  publish:
    name: Release (${{ matrix.os }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate source-test parity manifest
        run: python3 scripts/generate_test_asset_manifest.py --output thymeleaf-test/source-test-parity.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --workspace --release

      - name: Run tests (release profile, same targets as CI)
        run: cargo test --workspace --release --locked

      - name: Validate crate manifest (dry-run)
        run: cargo publish --dry-run --allow-dirty -p thymeleaf

      - name: Build documentation
        run: cargo doc --no-deps --workspace

  create-release:
    name: Create GitHub Release
    needs: [validate-tag, publish-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section for tag
        id: extract
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # 提取以 [VERSION] 开头的块到下一个 ## [
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1}
            found {print}
            found && /^## \[/ && $0 !~ "^## \\[" ver "\\]" {exit}
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "::error::CHANGELOG.md 缺少 [${VERSION}] 条目"
            exit 1
          fi
          {
            echo "# Release Notes"
            echo
            echo "完整变更日志见 [CHANGELOG.md](../../blob/main/CHANGELOG.md)。"
            echo
            echo "## Highlights"
            echo
            echo "$SECTION"
          } > release-notes.md

      - name: Create GitHub Release (draft, auto-pre-release for alpha/beta/rc)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true  # 草稿——待维护者审核
          prerelease: ${{ contains(needs.validate-tag.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Block-on gate (CHANGELOG [Unreleased] 无未完成项)
        run: scripts/check_block_on.sh

  precheck:
    name: Publish Precheck
    needs: [validate-tag, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 参考 wxrust scripts/publish-order.sh：本仓只发 1 个 crate（thymeleaf-test
      # publish=false），预检脚本验证元数据/无内部 path 依赖/dry-run/CHANGELOG
      - name: Run publish-precheck (metadata + dry-run + CHANGELOG)
        env:
          THYMELEAF_UPSTREAM: ${{ github.workspace }}/upstream-thymeleaf
        run: scripts/publish-precheck.sh

  dry-run-publish:
    name: Dry-run Publish (validation)
    needs: [validate-tag, precheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo publish --dry-run for single crate
        env:
          THYMELEAF_UPSTREAM: ${{ github.workspace }}/upstream-thymeleaf
        run: cargo publish -p thymeleaf --dry-run --allow-dirty

  publish-crates:
    name: Publish to crates.io
    needs: [validate-tag, dry-run-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 参考 wxrust publish-013.sh：3 次重试（含 429 限流退避 + 版本已存在
      # 幂等成功）。脚本内置 token 前置检查与失败终止。
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish.sh
